name: CI

# The gate before Vercel deploys: lint, the pure-logic tests, then a real build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Routing, search/sort and content integrity. No credentials needed —
      # the chat's fallback path is fully offline by design.
      - run: npm test
      - run: npm run build
